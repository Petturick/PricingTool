name: PrySight Supabase Production

on:
  workflow_run:
    workflows:
      - PrySight CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prysight-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: xmedaatjwxkmwkjmwuuz

    steps:
      - name: Resolve target commit
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Check production credentials
        id: credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase production deployment is ready, but SUPABASE_ACCESS_TOKEN and/or SUPABASE_DB_PASSWORD is missing in the GitHub production environment."
            echo "### Supabase deployment not executed" >> "$GITHUB_STEP_SUMMARY"
            echo "Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD to the GitHub production environment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.enabled == 'true'
        with:
          version: latest

      - name: Initialize Supabase CLI
        if: steps.credentials.outputs.enabled == 'true'
        run: supabase init --force

      - name: Link PrySight production
        if: steps.credentials.outputs.enabled == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview database migrations
        if: steps.credentials.outputs.enabled == 'true'
        run: supabase db push --dry-run

      - name: Deploy database migrations
        if: steps.credentials.outputs.enabled == 'true'
        run: supabase db push

      - name: Verify migration history
        if: steps.credentials.outputs.enabled == 'true'
        run: supabase migration list

      - name: Deployment summary
        if: steps.credentials.outputs.enabled == 'true'
        run: |
          echo "### PrySight Supabase production deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
          echo "Project: xmedaatjwxkmwkjmwuuz" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: ${{ steps.target.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
