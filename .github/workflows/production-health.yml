name: PrySight production health

on:
  workflow_run:
    workflows:
      - PrySight CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prysight-production-health
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ vars.PRICING_TOOL_BASE_URL || 'https://pricingtool.bolt.host' }}
      EXPECTED_DB_PROFILE: supavisor_session_tls_v3
      EXPECTED_DB_PORT: '5432'
    steps:
      - name: Verify application and database health
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            response="$(curl --silent --show-error --max-time 12 "${BASE_URL%/}/api/health" || true)"
            if HEALTH_RESPONSE="$response" EXPECTED_DB_PROFILE="$EXPECTED_DB_PROFILE" EXPECTED_DB_PORT="$EXPECTED_DB_PORT" node -e '
              const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}")
              if (health.status !== "ok") process.exit(1)
              if (health.database?.reachable !== true) process.exit(1)
              if (health.database?.profile !== process.env.EXPECTED_DB_PROFILE) process.exit(1)
              if (String(health.database?.port ?? "") !== process.env.EXPECTED_DB_PORT) process.exit(1)
            '; then
              echo "Production application and database are healthy on the expected Supavisor session profile."
              exit 0
            fi

            HEALTH_RESPONSE="$response" node -e '
              try {
                const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}")
                console.log(JSON.stringify({
                  status: health.status ?? "invalid_response",
                  configured: health.database?.configured ?? false,
                  reachable: health.database?.reachable ?? false,
                  reason: health.database?.reason ?? null,
                  errorCode: health.database?.errorCode ?? null,
                  configurationIssue: health.database?.configurationIssue ?? null,
                  host: health.database?.host ?? null,
                  port: health.database?.port ?? null,
                  profile: health.database?.profile ?? null,
                  source: health.database?.source ?? null,
                  retryAfterMs: health.database?.retryAfterMs ?? null,
                }))
              } catch {
                console.log(JSON.stringify({ status: "invalid_response" }))
              }
            '

            if [ "$attempt" -lt 8 ]; then
              sleep 15
            fi
          done

          echo "::error::Production database health remained unavailable or is running an unexpected database profile after retries."
          exit 1
