name: PrySight CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          DATABASE_URL: postgresql://pricing:pricing@127.0.0.1:5432/pricing
          NEXTAUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build
