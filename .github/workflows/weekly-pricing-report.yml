name: Weekly pricing report

on:
  schedule:
    - cron: '25 5 * * 1'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: ${{ secrets.PRICING_TOOL_BASE_URL }}
      API_KEY: ${{ secrets.REPORT_API_KEY }}
    steps:
      - name: Generate weekly report
        shell: bash
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$API_KEY" ]; then
            echo "PRICING_TOOL_BASE_URL or REPORT_API_KEY is not configured, skipping."
            exit 0
          fi
          curl --fail-with-body --retry 2 --retry-delay 5 \
            -X POST "${BASE_URL%/}/api/rapportages" \
            -H "Authorization: Bearer ${API_KEY}" \
            -H "Content-Type: application/json"
